<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0c12;color:#f5f5f7;font-family:Montserrat,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{opacity:0;animation:da 0s 4s forwards}body.da{opacity:1;animation:none}@keyframes da{to{opacity:1}}
header{max-width:1520px;margin:0 auto;padding:120px 48px 64px;display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center}
header img{width:clamp(120px,14vw,210px);height:auto;display:block}
.k{font-size:14px;letter-spacing:.34em;text-transform:uppercase;color:#9e947f;margin:0 0 18px;font-weight:500}
h1{font-weight:500;font-size:clamp(64px,9.5vw,148px);letter-spacing:-.045em;line-height:.9;margin:0}
.l{font-size:22px;line-height:1.5;color:#a1a1a6;max-width:640px;margin:26px 0 0;font-weight:400}
main{max-width:1520px;margin:0 auto;padding:0 48px 160px;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(44px,5.4vw,82px);gap:18px}
.tile{margin:0;position:relative;overflow:hidden;border-radius:26px;background:#14161f}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{position:absolute;left:16px;bottom:16px;font-size:13px;font-weight:500;letter-spacing:.04em;color:#fff;background:rgba(11,12,18,.55);padding:8px 14px;border-radius:999px}
.logo{background:#111421;display:flex;align-items:center;justify-content:center}
.logo img{width:62%;height:auto;object-fit:contain}
.farben{display:flex;flex-direction:column;background:#111421}
.sw{flex:1;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:13px;font-weight:500}
.sw b{font-weight:400;opacity:.7;letter-spacing:.08em;font-size:11px}
.farben figcaption{display:none}
footer{max-width:1520px;margin:0 auto;padding:0 48px 80px;color:#6e6e73;font-size:13px}
@media(max-width:900px){header{grid-template-columns:1fr;gap:28px;padding:72px 16px 36px}main{grid-template-columns:repeat(2,1fr);grid-auto-rows:120px;gap:10px;padding:0 16px 80px}.tile{grid-column:span 2 !important;grid-row:span 3 !important;border-radius:18px}.farben{grid-row:span 4 !important}footer{padding:0 16px 60px}}
</style></head><body>

an 6;grid-row:span 7"><img src="fotos/papier.webp" alt="Briefpapier und Siegel" style="object-position:50% 50%" decoding="async"><figcaption>Briefpapier und Siegel</figcaption></figure><figure class="tile" style="grid-column:span 6;grid-row:span 7"><img src="fotos/notizbuch.webp" alt="Notizbuch, Blindprägung" style="object-position:50% 50%" decoding="async"><figcaption>Notizbuch, Blindprägung</figcaption></figure><figure class="tile" style="grid-column:span 5;grid-row:span 9"><img src="fotos/tuer.webp" alt="Eingangstür am Abend" style="object-position:50% 50%" decoding="async"><figcaption>Eingangstür am Abend</figcaption></figure><figure class="tile" style="grid-column:span 4;grid-row:span 9"><img src="fotos/tasche.webp" alt="Tragetasche" style="object-position:50% 55%" decoding="async"><figcaption>Tragetasche</figcaption></figure><figure class="tile farben" style="grid-column:span 3;grid-row:span 9"><div class="sw" style="background:#111421;color:#f5f5f7"><span>Nachtblau</span><b>#111421</b></div><div class="sw" style="background:#1f213b;color:#f5f5f7"><span>Navy</span><b>#1F213B</b></div><div class="sw" style="background:#ebdbce;color:#111421"><span>Creme</span><b>#EBDBCE</b></div><div class="sw" style="background:#9e947f;color:#111421"><span>Taupe</span><b>#9E947F</b></div><div class="sw" style="background:#c9ccd2;color:#111421"><span>Silber</span><b>#C9CCD2</b></div><div class="sw" style="background:#ff3132;color:#ffffff"><span>Signal</span><b>#FF3132</b></div><figcaption>Farben</figcaption></figure></main>
<footer>Stand 4. November 2026.</footer>
<script>
(function(){var imgs=[].slice.call(document.querySelectorAll('img[data-erst]'));var n=imgs.length;function done(){document.body.classList.add('da')}
